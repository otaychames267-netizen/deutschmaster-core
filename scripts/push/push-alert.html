<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>AuraLingovia push alert banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #12090b; --gold-b: #e7bb54; --gold-c: #fbedbe; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 600px; overflow: hidden; background: var(--ink); }
  body { position: relative; font-family: "Cairo", "Manrope", "Segoe UI", system-ui, sans-serif; color: #fff7ee; }
  /* a hot ruby-to-amber field: unmistakably "important", still the brand's black + gold underneath */
  .field { position: absolute; inset: 0; background:
      radial-gradient(900px 520px at 85% 8%, rgba(255,170,60,.55), transparent 62%),
      radial-gradient(800px 560px at 6% 100%, rgba(225,29,72,.62), transparent 60%),
      linear-gradient(120deg, #2a0a10 0%, #4a0d18 45%, #7a1a14 100%); }
  .stripes { position: absolute; inset: 0; opacity: .12; background: repeating-linear-gradient(-35deg, #fff 0 2px, transparent 2px 26px); }
  .rule-top, .rule-bot { position: absolute; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, transparent, #a9782c, #e7bb54, #fbedbe, #e7bb54, #a9782c, transparent); }
  .rule-top { top: 0; } .rule-bot { bottom: 0; }

  .logo { position: absolute; left: 70px; top: 150px; width: 300px; height: 300px; border-radius: 76px;
    background: linear-gradient(150deg, #261b13, #0e0b0c); border: 2px solid rgba(231,187,84,.6);
    box-shadow: 0 30px 70px -18px rgba(0,0,0,.85), 0 0 80px -10px rgba(255,170,60,.55); display: grid; place-items: center; }
  .logo img { width: 230px; height: 230px; filter: drop-shadow(0 12px 18px rgba(0,0,0,.6)); }

  .copy { position: absolute; right: 80px; top: 118px; width: 700px; text-align: right; }
  .tri { display: inline-flex; align-items: center; justify-content: center; width: 112px; height: 112px; border-radius: 28px; font-size: 76px; line-height: 1;
    background: linear-gradient(140deg, #f7c548, #f59e0b); color: #3b0a10; box-shadow: 0 16px 36px -12px rgba(245,158,11,.8); }
  .h { margin-top: 22px; font-weight: 900; font-size: 128px; line-height: 1.05; letter-spacing: -.01em; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .en { margin-top: 6px; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: .34em; text-transform: uppercase; color: var(--gold-b); direction: ltr; text-align: right; }
  .brand { position: absolute; right: 80px; bottom: 52px; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -.01em; direction: ltr; color: rgba(255,247,238,.9); }
  .brand b { background: linear-gradient(100deg, #c9892c, #f3c653 40%, #fbedbe 60%, #d09a36); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
  <div class="field"></div><div class="stripes"></div>
  <div class="rule-top"></div><div class="rule-bot"></div>
  <div class="logo"><img src="../../public/favicon.svg" alt=""></div>
  <div class="copy">
    <span class="tri">⚠</span>
    <div class="h">تنبيه مهم</div>
    <div class="en">Important notice</div>
  </div>
  <div class="brand"><b>Aura</b>Lingovia</div>
</body>
</html>
